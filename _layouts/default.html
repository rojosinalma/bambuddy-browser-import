<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/icons/icon32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="128x128" href="{{ '/icons/icon128.png' | relative_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/docs/screenshot.jpg' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/icons/icon48.png' | relative_url }}" alt="" width="28" height="28">
      <span>{{ site.title }}</span>
    </a>
    <nav>
      <a href="{{ '/#install' | relative_url }}">Install</a>
      <a href="{{ '/#setup' | relative_url }}">Setup</a>
      <a href="{{ '/PRIVACY.html' | relative_url }}">Privacy</a>
      <a href="{{ '/TERMS.html' | relative_url }}">Terms</a>
      <a href="{{ site.repo }}" class="gh" title="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </nav>
  </header>

  <main class="{{ page.class | default: 'page' }}">
    {{ content }}
  </main>

  <footer>
    <span>© {{ 'now' | date: '%Y' }} rojosinalma · <a href="{{ site.repo }}/blob/main/LICENSE">MIT</a> · <a href="{{ '/PRIVACY.html' | relative_url }}">Privacy Policy</a> · <a href="{{ '/TERMS.html' | relative_url }}">Terms of Service</a></span>
    <span>Not affiliated with Bambu Lab, MakerWorld or the Bambuddy project.</span>
  </footer>
</body>
</html>
