name: AMO screenshots
run-name: AMO screenshots · ${{ github.actor }}

# Makes the screenshots on the addons.mozilla.org listing match docs/screenshots/ (*.png, *.jpg),
# in file name order, each with the caption from the list below. Listing images are not part of
# the extension, so this needs no version bump and no review.
#
# AMO limits uploads per hour. When some of the files are already on the listing, pass their
# preview ids in `keep` (one entry per file, in file name order, empty for a file that still has
# to be uploaded, e.g. "431370,431406,431407,"). Previews not listed are deleted, the rest get
# their position and caption set.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: Preview ids to keep, one per file in name order, empty = upload (blank = replace all)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  previews:
    runs-on: ubuntu-latest
    env:
      AMO_ADDON: bambuddy-browser-import
    steps:
      - uses: actions/checkout@v7

      - name: Sync previews
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          KEEP:           ${{ inputs.keep }}
        shell: python
        run: |
          import base64, hashlib, hmac, json, os, pathlib, time, urllib.error, urllib.request, uuid

          CAPTIONS = {
              "1-search-panel.png":  "Pick plates and a folder right from the MakerWorld search results",
              "2-model-panel.png":   "Or from the Import to Bambuddy button on a model page",
              "3-settings.png":      "Point it at your Bambuddy and test the connection",
              "4-toolbar-popup.jpg": "The toolbar popup on a model page: print time, colours, AMS and rating per profile",
          }
          TYPES = {".png": "image/png", ".jpg": "image/jpeg"}
          API = f"https://addons.mozilla.org/api/v5/addons/addon/{os.environ['AMO_ADDON']}/previews/"

          def b64(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          def token():
              now = int(time.time())
              head = b64(json.dumps({"alg": "HS256", "typ": "JWT"}).encode())
              body = b64(json.dumps({"iss": os.environ["AMO_JWT_ISSUER"], "jti": str(uuid.uuid4()),
                                     "iat": now, "exp": now + 60}).encode())
              sig = hmac.new(os.environ["AMO_JWT_SECRET"].encode(), f"{head}.{body}".encode(), hashlib.sha256).digest()
              return f"JWT {head}.{body}.{b64(sig)}"

          def call(method, url, data=None, ctype=None):
              # AMO answers 429 to bursts; wait as told and try again.
              for attempt in range(8):
                  req = urllib.request.Request(url, data=data, method=method, headers={"Authorization": token()})
                  if ctype:
                      req.add_header("Content-Type", ctype)
                  try:
                      with urllib.request.urlopen(req) as r:
                          raw = r.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      if e.code != 429 or attempt == 7:
                          raise SystemExit(f"{method} {url}: HTTP {e.code} {e.read()[:300]!r}")
                      wait = int(e.headers.get("Retry-After") or 0) or 15 * (attempt + 1)
                      print(f"429 on {method}, waiting {wait}s")
                      time.sleep(wait)

          def edit(preview_id, name, pos):
              want = {"position": pos, "caption": {"en-US": CAPTIONS[name]}}
              done = call("PATCH", f"{API}{preview_id}/", json.dumps(want).encode(), "application/json") or {}
              if done.get("caption", {}).get("en-US") != CAPTIONS[name] or done.get("position") != pos:
                  raise SystemExit(f"position/caption not stored on preview {preview_id}: {done!r}")

          files = sorted(f for f in pathlib.Path("docs/screenshots").iterdir() if f.suffix in TYPES)
          missing = [f.name for f in files if f.name not in CAPTIONS]
          if not files or missing:
              raise SystemExit(f"no screenshots, or no caption for: {missing}")

          keep = [k.strip() for k in os.environ["KEEP"].split(",")] if os.environ["KEEP"].strip() else [""] * len(files)
          if len(keep) != len(files):
              raise SystemExit(f"keep has {len(keep)} entries, there are {len(files)} files")

          addon = call("GET", API.rsplit("previews/", 1)[0])
          on_amo = {str(p["id"]) for p in addon["previews"]}
          unknown = [k for k in keep if k and k not in on_amo]
          if unknown:
              raise SystemExit(f"not on the listing: {unknown}")

          for pid in sorted(on_amo - set(keep)):
              call("DELETE", f"{API}{pid}/")
              print(f"deleted preview {pid}")

          for pos, (f, pid) in enumerate(zip(files, keep)):
              if not pid:
                  boundary = uuid.uuid4().hex
                  body = b"".join([
                      f"--{boundary}\r\nContent-Disposition: form-data; name=\"position\"\r\n\r\n{pos}\r\n".encode(),
                      f"--{boundary}\r\nContent-Disposition: form-data; name=\"image\"; filename=\"{f.name}\"\r\n"
                      f"Content-Type: {TYPES[f.suffix]}\r\n\r\n".encode(),
                      f.read_bytes(),
                      f"\r\n--{boundary}--\r\n".encode(),
                  ])
                  pid = call("POST", API, body, f"multipart/form-data; boundary={boundary}")["id"]
                  print(f"uploaded {f.name} as preview {pid}")
              edit(pid, f.name, pos)
              print(f"{pos}: {f.name} on preview {pid}")
