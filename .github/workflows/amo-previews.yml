name: AMO screenshots
run-name: AMO screenshots · ${{ github.actor }}

# Replaces the screenshots on the addons.mozilla.org listing with docs/screenshots/*.png, in file
# name order, each with the caption from the list below. Listing images are not part of the
# extension, so this needs no version bump and no review.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previews:
    runs-on: ubuntu-latest
    env:
      AMO_ADDON: bambuddy-browser-import
    steps:
      - uses: actions/checkout@v7

      - name: Replace previews
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: python
        run: |
          import base64, hashlib, hmac, json, os, pathlib, time, urllib.error, urllib.request, uuid

          CAPTIONS = {
              "1-search-bubbles.png": "An import bubble on every thumbnail in MakerWorld search results",
              "2-search-panel.png":   "Pick plates and a folder right from the search results",
              "3-model-button.png":   "Import to Bambuddy, right next to Open in Bambu Studio",
              "4-model-panel.png":    "The picker on a model page: print time, colours, rating and printer per profile",
              "5-settings.png":       "Point it at your Bambuddy and test the connection",
          }
          API = f"https://addons.mozilla.org/api/v5/addons/addon/{os.environ['AMO_ADDON']}/previews/"

          def b64(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          def token():
              now = int(time.time())
              head = b64(json.dumps({"alg": "HS256", "typ": "JWT"}).encode())
              body = b64(json.dumps({"iss": os.environ["AMO_JWT_ISSUER"], "jti": str(uuid.uuid4()),
                                     "iat": now, "exp": now + 60}).encode())
              sig = hmac.new(os.environ["AMO_JWT_SECRET"].encode(), f"{head}.{body}".encode(), hashlib.sha256).digest()
              return f"JWT {head}.{body}.{b64(sig)}"

          def call(method, url, data=None, ctype=None):
              # AMO answers 429 to bursts; wait as told and try again.
              for attempt in range(8):
                  req = urllib.request.Request(url, data=data, method=method, headers={"Authorization": token()})
                  if ctype:
                      req.add_header("Content-Type", ctype)
                  try:
                      with urllib.request.urlopen(req) as r:
                          raw = r.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      if e.code != 429 or attempt == 7:
                          raise SystemExit(f"{method} {url}: HTTP {e.code} {e.read()[:300]!r}")
                      wait = int(e.headers.get("Retry-After") or 0) or 15 * (attempt + 1)
                      print(f"429 on {method}, waiting {wait}s")
                      time.sleep(wait)

          files = sorted(pathlib.Path("docs/screenshots").glob("*.png"))
          missing = [f.name for f in files if f.name not in CAPTIONS]
          if not files or missing:
              raise SystemExit(f"no screenshots, or no caption for: {missing}")

          addon = call("GET", API.rsplit("previews/", 1)[0])
          for p in addon["previews"]:
              call("DELETE", f"{API}{p['id']}/")
              print(f"deleted preview {p['id']}")

          for pos, f in enumerate(files):
              boundary = uuid.uuid4().hex
              body = b"".join([
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"position\"\r\n\r\n{pos}\r\n".encode(),
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"image\"; filename=\"{f.name}\"\r\n"
                  "Content-Type: image/png\r\n\r\n".encode(),
                  f.read_bytes(),
                  f"\r\n--{boundary}--\r\n".encode(),
              ])
              preview = call("POST", API, body, f"multipart/form-data; boundary={boundary}")
              call("PATCH", f"{API}{preview['id']}/",
                   json.dumps({"caption": {"en-US": CAPTIONS[f.name]}}).encode(), "application/json")
              print(f"{pos}: {f.name} -> preview {preview['id']}")
