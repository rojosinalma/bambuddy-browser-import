name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Files that make up the extension. Everything else in the repo stays out of the packages.
  PACKAGE_FILES: manifest.json shared.js background.js content.js popup.html popup.js popup.css options.html options.js options.css icons

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(jq -r .version manifest.json)
          NAME=bambuddy-browser-import
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "chrome_zip=$NAME-$VERSION-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_xpi=$NAME-$VERSION-firefox.xpi" >> "$GITHUB_OUTPUT"
          echo "chrome_crx=$NAME-$VERSION-chrome.crx" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::Release ${{ steps.meta.outputs.tag }} already exists — bump manifest.json version to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip == 'false'
        with:
          node-version: 22

      - name: Syntax check
        if: steps.exists.outputs.skip == 'false'
        run: for f in *.js; do node --check "$f"; done

      - name: Stage package
        if: steps.exists.outputs.skip == 'false'
        run: |
          mkdir -p build/pkg
          cp -r $PACKAGE_FILES build/pkg/

      - name: Lint (web-ext)
        if: steps.exists.outputs.skip == 'false'
        run: npx --yes web-ext lint --source-dir build/pkg --warnings-as-errors=false

      - name: Build Chrome zip
        if: steps.exists.outputs.skip == 'false'
        run: |
          cd build/pkg
          zip -r -X "../${{ steps.meta.outputs.chrome_zip }}" .

      # Signed with the Verified CRX Uploads key registered in the Chrome Web Store dashboard;
      # this is the file to upload there. Skipped when the CWS_SIGNING_KEY secret is absent.
      - name: Build signed Chrome crx
        if: steps.exists.outputs.skip == 'false' && env.CWS_SIGNING_KEY != ''
        env:
          CWS_SIGNING_KEY: ${{ secrets.CWS_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$CWS_SIGNING_KEY" > "$RUNNER_TEMP/cws.pem"
          python3 scripts/build-crx.py \
            --key "$RUNNER_TEMP/cws.pem" \
            --zip "build/${{ steps.meta.outputs.chrome_zip }}" \
            --out "build/${{ steps.meta.outputs.chrome_crx }}"
          rm -f "$RUNNER_TEMP/cws.pem"
          # Chromium browsers discard .crx downloads from outside the Web Store; a zipped copy survives.
          (cd build && zip -q -X "${{ steps.meta.outputs.chrome_crx }}.zip" "${{ steps.meta.outputs.chrome_crx }}")

      - name: Build Firefox xpi (unsigned)
        if: steps.exists.outputs.skip == 'false'
        run: |
          cd build/pkg
          zip -r -X "../${{ steps.meta.outputs.firefox_xpi }}" .

      # Submits the new version to the add-on's listing on addons.mozilla.org for review
      # (channel "listed" never returns a signed file — AMO distributes it after approval).
      # Needs AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets from
      # https://addons.mozilla.org/developers/addon/api/key/ ; skipped when absent.
      - name: Submit to addons.mozilla.org
        if: steps.exists.outputs.skip == 'false' && env.AMO_JWT_ISSUER != ''
        continue-on-error: true   # a version already on AMO must not block the GitHub release
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir build/pkg \
            --artifacts-dir build/amo \
            --channel listed \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Create release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            build/*.zip build/*.crx build/*.xpi \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --notes "**Chrome / Chromium / Edge / Brave:** download the \`.zip\`, unzip, \`chrome://extensions\` → Developer mode → Load unpacked. The \`.crx\` is the store-upload package, signed with the project's Verified CRX Uploads key — grab the \`.crx.zip\` if your browser blocks the bare file.
          **Firefox:** install from [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/bambuddy-browser-import/) — the \`.xpi\` here is the unsigned source package (temporary install via \`about:debugging\` only)."

      # Uploads the signed .crx to the Chrome Web Store item and submits it for review.
      # Needs CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN; skipped when absent.
      # Fails harmlessly (job still green) while the item is not yet published for the first time.
      - name: Upload to Chrome Web Store
        if: steps.exists.outputs.skip == 'false' && env.CWS_REFRESH_TOKEN != '' && env.CWS_SIGNING_KEY != ''
        continue-on-error: true
        env:
          CWS_CLIENT_ID:     ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_SIGNING_KEY:   ${{ secrets.CWS_SIGNING_KEY }}
          CWS_ITEM_ID:       kcffnknnapkmkabmkbghccgjfcgiobgb
        run: |
          TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "::error::could not obtain access token"; exit 1; }

          CRX="build/${{ steps.meta.outputs.chrome_crx }}"
          UPLOAD=$(curl -sf -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -H "X-Goog-Upload-Protocol: raw" -H "X-Goog-Upload-File-Name: $(basename "$CRX")" \
            --data-binary @"$CRX" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_ITEM_ID")
          echo "upload: $UPLOAD"
          [ "$(echo "$UPLOAD" | jq -r .uploadState)" = "SUCCESS" ] || { echo "::error::upload rejected"; exit 1; }

          PUBLISH=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_ITEM_ID/publish")
          echo "publish: $PUBLISH"
          echo "$PUBLISH" | jq -e '.status | index("OK") or index("ITEM_PENDING_REVIEW")' >/dev/null \
            || { echo "::error::publish not accepted"; exit 1; }
