# GitHub Pages (https://bambuddy-import.rojo.dev)
# Home page is index.md; PRIVACY.md and TERMS.md render as /PRIVACY.html and /TERMS.html.
# Everything that is part of the extension itself is excluded from the site.
title: Bambuddy Browser Import
description: Import MakerWorld print profiles into your self-hosted Bambuddy library, from Chrome or Firefox.
url: https://bambuddy-import.rojo.dev
repo: https://github.com/rojosinalma/bambuddy-browser-import
chrome_store: https://chromewebstore.google.com/detail/kcffnknnapkmkabmkbghccgjfcgiobgb
firefox_store: https://addons.mozilla.org/firefox/addon/bambuddy-browser-import/

markdown: kramdown

include:
  - icons
  - docs
exclude:
  - README.md
  - LICENSE
  - "*.js"
  - manifest.json
  - popup.html
  - popup.css
  - options.html
  - options.css
  - scripts
  - AGENTS.md
  - .github
  - .openchamber

defaults:
  - scope:
      path: ""
    values:
      layout: default
